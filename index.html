<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSE Seminar 2026</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(circle at 20% 20%, #07345a 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, #062d4b 0%, transparent 30%),
                #010914;

            font-family: Georgia, "Times New Roman", serif;
            color: white;
            overflow-x: hidden;
        }

        /* Moving background lights */
        #particles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;

            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 20px 10px 40px;
        }

        .content {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        /* YOUR ORIGINAL POSTER */
        .poster-wrapper {
            width: 100%;
            overflow: hidden;

            border-radius: 6px;

            box-shadow:
                0 0 20px rgba(255, 210, 120, 0.18),
                0 0 45px rgba(255, 190, 70, 0.10);
        }

        .poster {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Countdown */
        .countdown-area {
            margin-top: 22px;
        }

        .countdown-title {
            color: #e0b968;

            font-size: 19px;
            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 14px;

            text-shadow:
                0 0 8px rgba(255, 211, 120, 0.4);
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .time-box {
            background:
                linear-gradient(
                    145deg,
                    rgba(5, 27, 47, 0.96),
                    rgba(1, 12, 24, 0.96)
                );

            border: 1px solid #c69b4d;
            border-radius: 8px;

            padding: 13px 5px;

            box-shadow:
                inset 0 0 15px rgba(220, 170, 70, 0.08),
                0 0 12px rgba(220, 170, 70, 0.12);
        }

        .number {
            display: block;

            color: #f2dfb0;

            font-size: 32px;
            font-weight: bold;

            line-height: 1.1;

            text-shadow:
                0 0 10px rgba(255, 220, 140, 0.35);
        }

        .label {
            display: block;

            margin-top: 6px;

            color: #cda65b;

            font-size: 10px;

            letter-spacing: 2px;
        }

        /* Event started */
        .started {
            display: none;

            margin-top: 20px;
            padding: 16px;

            border: 1px solid #c69b4d;
            border-radius: 8px;

            color: #f0d38b;

            font-size: 23px;
            font-weight: bold;

            background: rgba(2, 18, 32, 0.9);

            box-shadow:
                0 0 20px rgba(220, 175, 80, 0.2);
        }

        /* Mobile */
        @media (max-width: 500px) {

            .page {
                padding:
                    10px
                    8px
                    30px;
            }

            .countdown-title {
                font-size: 15px;
                letter-spacing: 2px;
            }

            .countdown {
                gap: 6px;
            }

            .time-box {
                padding: 11px 3px;
            }

            .number {
                font-size: 25px;
            }

            .label {
                font-size: 8px;
                letter-spacing: 1px;
            }

            .started {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Moving lights -->
    <canvas id="particles"></canvas>

    <main class="page">

        <div class="content">

            <!-- =================================
                 YOUR ORIGINAL POSTER
                 FILE NAME: poster.jpeg
            ================================== -->

            <div class="poster-wrapper">

                <img
                    src="poster.jpeg"
                    class="poster"
                    alt="CSE Seminar Invitation"
                >

            </div>


            <!-- =================================
                 LIVE COUNTDOWN
            ================================== -->

            <section class="countdown-area">

                <div
                    class="countdown-title"
                    id="countdownTitle"
                >
                    EVENT STARTS IN
                </div>

                <div
                    class="countdown"
                    id="countdown"
                >

                    <div class="time-box">

                        <span
                            class="number"
                            id="days"
                        >
                            00
                        </span>

                        <span class="label">
                            DAYS
                        </span>

                    </div>


                    <div class="time-box">

                        <span
                            class="number"
                            id="hours"
                        >
                            00
                        </span>

                        <span class="label">
                            HOURS
                        </span>

                    </div>


                    <div class="time-box">

                        <span
                            class="number"
                            id="minutes"
                        >
                            00
                        </span>

                        <span class="label">
                            MINUTES
                        </span>

                    </div>


                    <div class="time-box">

                        <span
                            class="number"
                            id="seconds"
                        >
                            00
                        </span>

                        <span class="label">
                            SECONDS
                        </span>

                    </div>

                </div>


                <div
                    class="started"
                    id="started"
                >
                    🎉 THE SEMINAR HAS STARTED! 🎉
                </div>

            </section>

        </div>

    </main>


    <script>

        /* =========================================
           SEMINAR DATE & TIME

           22 AUGUST 2026
           10:00 AM
           INDIA TIME (IST)
        ========================================= */

        const eventTime =
            new Date(
                "2026-08-22T10:00:00+05:30"
            ).getTime();


        /* =========================================
           COUNTDOWN
        ========================================= */

        function updateCountdown() {

            const now =
                new Date().getTime();

            const difference =
                eventTime - now;


            /* Event started */

            if (difference <= 0) {

                document
                    .getElementById("countdown")
                    .style.display = "none";

                document
                    .getElementById("countdownTitle")
                    .style.display = "none";

                document
                    .getElementById("started")
                    .style.display = "block";

                return;
            }


            const days =
                Math.floor(
                    difference /
                    (1000 * 60 * 60 * 24)
                );


            const hours =
                Math.floor(
                    (difference %
                    (1000 * 60 * 60 * 24))
                    /
                    (1000 * 60 * 60)
                );


            const minutes =
                Math.floor(
                    (difference %
                    (1000 * 60 * 60))
                    /
                    (1000 * 60)
                );


            const seconds =
                Math.floor(
                    (difference %
                    (1000 * 60))
                    /
                    1000
                );


            document.getElementById("days")
                .textContent =
                String(days).padStart(2, "0");


            document.getElementById("hours")
                .textContent =
                String(hours).padStart(2, "0");


            document.getElementById("minutes")
                .textContent =
                String(minutes).padStart(2, "0");


            document.getElementById("seconds")
                .textContent =
                String(seconds).padStart(2, "0");
        }


        updateCountdown();

        setInterval(
            updateCountdown,
            1000
        );


        /* =========================================
           LIVE GOLDEN LIGHT PARTICLES
        ========================================= */

        const canvas =
            document.getElementById("particles");

        const ctx =
            canvas.getContext("2d");

        let particles = [];


        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;
        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );

        resizeCanvas();


        /* Create particles */

        for (
            let i = 0;
            i < 100;
            i++
        ) {

            particles.push({

                x:
                    Math.random()
                    * canvas.width,

                y:
                    Math.random()
                    * canvas.height,

                size:
                    Math.random()
                    * 2.5 + 0.5,

                speed:
                    Math.random()
                    * 0.35 + 0.05,

                alpha:
                    Math.random(),

                direction:
                    Math.random() > 0.5
                    ? 1
                    : -1
            });
        }


        /* Animate particles */

        function animateParticles() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            particles.forEach(
                particle => {

                    particle.y -=
                        particle.speed;


                    particle.alpha +=
                        0.008 *
                        particle.direction;


                    if (
                        particle.alpha >= 1 ||
                        particle.alpha <= 0.15
                    ) {

                        particle.direction *= -1;
                    }


                    if (
                        particle.y < -10
                    ) {

                        particle.y =
                            canvas.height + 10;

                        particle.x =
                            Math.random()
                            * canvas.width;
                    }


                    ctx.beginPath();


                    ctx.arc(
                        particle.x,
                        particle.y,
                        particle.size,
                        0,
                        Math.PI * 2
                    );


                    ctx.fillStyle =
                        `rgba(
                            235,
                            195,
                            105,
                            ${particle.alpha}
                        )`;


                    ctx.shadowBlur = 12;

                    ctx.shadowColor =
                        "rgba(235,195,105,0.8)";


                    ctx.fill();

                }
            );


            requestAnimationFrame(
                animateParticles
            );
        }


        animateParticles();

    </script>

</body>
</html>
